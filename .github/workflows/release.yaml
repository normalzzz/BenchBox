name: Release

on:
  push:
    tags:
      - "v*.*"
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/benchbox
  DOCKERHUB_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/benchbox

jobs:
  release:
    name: Build image and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=ref,event=tag
            type=match,pattern=v(.*),group=1
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## Docker Image

          ```bash
          docker pull ${{ env.DOCKERHUB_IMAGE }}:${{ github.ref_name }}
          docker pull ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}
          ```

          ## Kubernetes

          ```bash
          kubectl set image deployment/benchbox benchbox=${{ env.DOCKERHUB_IMAGE }}:${{ github.ref_name }} -n benchbox
          ```
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BenchBox ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false

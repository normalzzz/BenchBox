apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: benchbox
  namespace: benchbox
  labels:
    app.kubernetes.io/name: benchbox
    app.kubernetes.io/component: app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: benchbox
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
